version: "3.9"

services:

  # ─── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: securearch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend (Python / FastAPI) ──────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securearch_backend
    restart: unless-stopped
    environment:
      # Чистый DATABASE_URL без search_path в URL — search_path задаётся через DB_SCHEMA
      DATABASE_URL: postgresql://postgres:postgres@db:5432/securearch
      DB_SCHEMA: t_p90536134_security_requirement
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Frontend (React / Vite → nginx) ─────────────────────────
  # ВАЖНО: VITE_API_BASE должен быть адресом, доступным из БРАУЗЕРА пользователя.
  # Браузер на хосте → nginx (порт 80) → /api/* проксируется → backend:8000
  # Поэтому API-запросы идут через тот же порт 80, на /api/...
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE: ""
    container_name: securearch_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
