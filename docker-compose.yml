version: "3.9"

services:

  # ─── PostgreSQL ────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: securearch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      # 1. Создаём схему до применения миграций
      - ./docker/init-schema.sql:/docker-entrypoint-initdb.d/00-init-schema.sql:ro
      # 2. Применяем все миграции в алфавитном порядке (V0001…V0018)
      - ./db_migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./docker/run-migrations.sh:/docker-entrypoint-initdb.d/01-run-migrations.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securearch"]
      interval: 5s
      timeout: 5s
      retries: 15

  # ─── Frontend (Vite + React) ──────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: securearch_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      # hot-reload: изменения в /src сразу видны без пересборки
      - ./src:/app/src:ro
      - ./public:/app/public:ro
    depends_on:
      - api

  # ─── Backend API (FastAPI) ─────────────────────────────────────────
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securearch_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/securearch
      APP_ENV: local
    ports:
      - "8000:8000"
    volumes:
      # hot-reload: изменения в /backend сразу видны без пересборки
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data: