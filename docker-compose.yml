version: "3.9"

services:

  # ─── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: securearch_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: securearch
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d securearch"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Backend (Python / FastAPI + Lambda-handlers) ────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securearch_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/securearch?options=-csearch_path%3Dt_p90536134_security_requirement
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # ─── Frontend (React / Vite) ──────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: securearch_frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  db_data:
